    <form id="member-form" class="account-panel" hidden>
      <div id="account-mode" class="account-actions account-options" role="group" aria-label="מצב חשבון">
        <button id="mode-login" class="account-control" type="button" aria-pressed="true">התחברות</button>
        <button id="mode-register" class="account-control" type="button" aria-pressed="false">הרשמה</button>
      </div>
      <label for="email">כתובת מייל</label>
      <input id="email" name="email" type="email" dir="ltr" autocomplete="username" maxlength="254" required>
      <label for="password">סיסמה</label>
      <div class="account-password">
        <input id="password" name="password" type="password" dir="ltr" minlength="10" maxlength="128" autocomplete="current-password" required>
        <button id="password-visibility" type="button" aria-controls="password">הצגה</button>
      </div>
      <div class="account-actions account-options">
        <button id="submit-account" class="account-control account-primary">התחברות במייל וסיסמה</button>
        <span id="account-divider" class="account-divider" hidden>או</span>
        <a id="google-sign-in" class="account-control account-google" href="/api/account/google/start" hidden><img src="/google-mark.svg" alt="" width="18" height="18"><span id="google-action">התחברות עם Google</span></a>
        <a id="google-cancel" class="account-control" href="/account" hidden>חזרה למסך הכניסה</a>
      </div>
      <p id="member-note" hidden></p>
    </form>
    <section id="member-panel" class="account-panel" hidden>
      <p id="member-name"><bdi id="member-email" dir="ltr"></bdi></p>
      <div class="account-actions account-options">
        <button id="change-password" class="account-control" type="button" aria-expanded="false" aria-controls="password-change-form">החלפת סיסמה</button>
        <button id="member-logout" class="account-control" type="button">יציאה</button>
      </div>
      <form id="password-change-form" hidden>
        <label for="current-password">סיסמה נוכחית</label>
        <input id="current-password" type="password" dir="ltr" autocomplete="current-password" required maxlength="128">
        <label for="new-password">סיסמה חדשה</label>
        <input id="new-password" type="password" dir="ltr" autocomplete="new-password" required minlength="10" maxlength="128">
        <div class="account-actions account-options">
          <button id="save-password" class="account-control account-primary">שמירת סיסמה</button>
        </div>
      </form>
    </section>
    <p id="account-status" class="account-status" role="status">טוען…</p>
