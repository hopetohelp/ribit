<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>חנות Android · הפלא השמיני</title>
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/chat.css">
  <link rel="stylesheet" href="/navigation.css">
</head>
<body>
  <main>
    <header class="page-header">
      <a href="/" class="back-button" aria-label="חזרה">→</a>
      <a href="/" class="brand-logo" aria-label="הפלא השמיני · למסך הראשי">
        <img src="/icon-192.png" alt="" width="34" height="34">
      </a>
    </header>
    <h1>חנות Android של ריבית</h1>
    <section class="panel account-panel" aria-labelledby="android-install">
      <h2 id="android-install">התקנה ועדכון</h2>
      <p id="android-release-status" role="status">בודקים איזו גרסה זמינה…</p>
      <a id="android-download" class="button" href="/download" hidden>הורדת APK</a>
      <button type="button" id="android-retry" hidden>בדיקה חוזרת</button>
      <p>אחרי ההורדה, פתחו את הקובץ ואשרו את ההתקנה במסך של Android. בהתקנה הראשונה ייתכן שתתבקשו לאפשר התקנה מהדפדפן.</p>
      <p>כדי לשמור על החישובים, התקינו את העדכון מעל האפליקציה הקיימת.</p>
    </section>
  </main>
  <script src="/android-store.js" defer></script>
</body>
</html>
