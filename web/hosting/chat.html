<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>צ׳אט · הפלא השמיני</title>
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/chat.css">
  <link rel="stylesheet" href="/navigation.css">
</head>
<body>
  <main>
    <header class="page-header">
      <a href="/" class="brand-logo corner-logo" aria-label="הפלא השמיני · למסך הראשי">
        <img src="/icon-192.png" alt="" width="34" height="34">
      </a>
      <button id="logout" type="button" hidden>יציאה</button>
    </header>
    <h1 id="title">נשמח לשמוע אתכם</h1>
    <form id="login" class="panel" hidden>
      <label for="password">סיסמת מנהל האתר</label>
      <input id="password" type="password" required minlength="12" maxlength="128" autocomplete="current-password">
      <button id="login-button">כניסה</button>
    </form>
    <div id="chat" class="chat" hidden>
      <aside id="inbox" class="panel" hidden aria-label="שיחות פתוחות">
        <h2>שיחות</h2>
        <div id="threads"></div>
      </aside>
      <section class="panel thread" aria-label="שיחה">
        <div class="chat-notice">
          <p id="intro" role="status">בודקים את החיבור לצ׳אט…</p>
          <a id="chat-sign-in" class="chat-control" href="/account?next=chat" hidden>התחברות</a>
        </div>
        <div id="messages" role="log" aria-label="הודעות" tabindex="0"></div>
        <form id="send">
          <label for="message">הודעה</label>
          <div class="compose">
            <textarea id="message" dir="auto" maxlength="2000" rows="2" required></textarea>
            <button id="send-button"><span id="send-icon" data-icon="send" aria-hidden="true"></span><span id="send-label">שליחה</span></button>
          </div>
        </form>
      </section>
    </div>
    <p id="status" role="status"></p>
  </main>
  <script src="/icons.js" defer></script>
  <script src="/floating.js" defer></script>
  <script src="/chat.js" defer></script>
</body>
</html>
