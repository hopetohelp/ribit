<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fafbff">
  <title>ריבית</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/preview.css">
</head>
<body>
  <main id="preview">
    <div class="stage">
      <div class="footprint">
        <div class="device">
          <div class="side">
            <button type="button" data-scroll="-1" aria-label="גלילה למעלה">+</button>
            <button type="button" data-scroll="1" aria-label="גלילה למטה">−</button>
            <button type="button" id="power" aria-label="הדלקת או כיבוי תצוגה" aria-pressed="false">⏻</button>
          </div>
          <div class="device-top" aria-hidden="true"><i></i></div>
          <div class="glass">
  <section id="landing" aria-label="עמוד פתיחה">
    <div class="landing-content">
    <header class="intro">
      <img src="/icon-192.png" alt="" width="58" height="58">
      <h1>ריבית</h1>
      <p>חשבו, השוו ושמרו מסלולי השקעה.</p>
      <a class="primary" href="/download">הורדה לאנדרואיד</a>
    </header>
    <section class="launch" aria-labelledby="launch-title">
      <h2 id="launch-title">הצגה כאפליקציה</h2>
      <div id="profiles" role="group" aria-label="סוג מכשיר">
        <button type="button" data-model="smartphone">סמארטפון · iPhone 15</button>
        <button type="button" data-model="touch">שיאומי טאצ׳ · Redmi Note 13</button>
        <button type="button" data-model="keys">שיאומי מקשים · Qin F21 Pro</button>
      </div>
      <div class="sizes" role="group" aria-label="גודל התצוגה">
        <button type="button" data-size="fit" aria-pressed="true">התאמה למסך</button>
        <button type="button" data-size="real" aria-pressed="false">גודל אמיתי</button>
      </div>
      <details id="calibration" hidden>
        <summary>כיול גודל</summary>
        <label>התאם את הקו ל־5 ס״מ בסרגל פיזי <input id="scale" type="range" min="100" max="200" value="100"></label>
        <div id="ruler" aria-hidden="true"></div>
        <button id="reset-scale" type="button">איפוס</button>
      </details>
    </section>
    <section class="statistics" aria-label="נתוני האתר">
      <div><strong id="views">—</strong><span>צפיות באתר</span></div>
      <div><strong id="downloads">—</strong><span>הורדות דרך האתר</span></div>
    </section>
    <section class="history">
      <h2>היסטוריית גרסאות</h2>
      <p><a href="https://github.com/hopetohelp/ribit/releases/tag/v2.0.0">2.0.0</a> · דמי ניהול, אינפלציה, מס ומראה כהה</p>
      <p><a href="https://github.com/hopetohelp/ribit/releases/tag/v1.0.0">1.0.0</a> · מחשבון, השוואה ושמירה באופליין</p>
    </section>
    </div>
  </section>

            <iframe id="app" hidden title="אפליקציית ריבית" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
            <div id="screen-off" hidden></div>
          </div>
      <div id="keypad" aria-label="מקשי המכשיר" hidden>
        <div class="directions" role="group" aria-label="ניווט">
          <button type="button" data-key="Back" aria-label="חזרה">↶</button>
          <button type="button" data-key="ArrowUp" aria-label="למעלה">↑</button>
          <button type="button" data-key="Backspace" aria-label="מחיקת תו">⌫</button>
          <button type="button" data-key="ArrowRight" aria-label="ימינה">→</button>
          <button type="button" data-key="Enter" aria-label="אישור">●</button>
          <button type="button" data-key="ArrowLeft" aria-label="שמאלה">←</button>
          <button type="button" data-key="-" aria-label="מינוס">−</button>
          <button type="button" data-key="ArrowDown" aria-label="למטה">↓</button>
          <button type="button" data-key="." aria-label="נקודה">.</button>
        </div>
        <div class="digits" role="group" aria-label="מספרים" dir="ltr">
          <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
          <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
          <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
          <button type="button" data-key="0">0</button>
        </div>
      </div>
        </div>
      </div>
    </div>
  </main>
  <script src="/preview.js" defer></script>
</body>
</html>
