<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fafbff">
  <title>ריבית</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/preview.css">
</head>
<body>
  <main id="preview">
    <div class="stage">
      <div class="footprint">
        <div class="device">
          <div class="hardware">
          <div class="side">
            <button type="button" data-scroll="-1" aria-label="גלילה למעלה">+</button>
            <button type="button" data-scroll="1" aria-label="גלילה למטה">−</button>
            <button type="button" class="device-back" data-key="Back" aria-label="חזרה או יציאה">↶</button>
          </div>
          <div class="device-top" aria-hidden="true"><i></i></div>
          <div class="f21-signature" aria-hidden="true">Qin AI Life</div>
          <div class="glass">
  <section id="landing" aria-label="עמוד פתיחה">
    <div class="landing-content">
    <header class="intro">
      <img src="/icon-192.png" alt="" width="58" height="58">
      <h1>ריבית</h1>
      <p>חשבו, השוו ושמרו מסלולי השקעה.</p>
      <a class="primary" href="/download">להורדת האפליקציה</a>
    </header>
    <section class="launch" aria-labelledby="launch-title">
      <h2 id="launch-title">הצגה כאפליקציה</h2>
      <div id="profiles" role="group" aria-label="סוג מכשיר">
        <button type="button" data-model="smartphone">מגע · iPhone 15</button>
        <button type="button" data-model="touch">מגע ומקשים · Qin F21 Pro</button>
        <button type="button" data-model="keys">מקשים ללא מגע · Qin 1S+</button>
      </div>
      <div class="sizes" role="group" aria-label="גודל התצוגה">
        <button type="button" data-size="fit" aria-pressed="true">התאמה למסך</button>
        <button type="button" data-size="real" aria-pressed="false">גודל אמיתי</button>
      </div>
      <details id="calibration" hidden>
        <summary>כיול גודל</summary>
        <label>התאם את הקו ל־5 ס״מ בסרגל פיזי <input id="scale" type="range" min="100" max="200" value="100"></label>
        <div id="ruler" aria-hidden="true"></div>
        <button id="reset-scale" type="button">איפוס</button>
      </details>
    </section>
    <section class="statistics" aria-label="נתוני האתר">
      <div><strong id="visitors">—</strong><span>צופים באתר</span></div>
      <div><strong id="downloads">—</strong><span>הורדות</span></div>
    </section>
    <a class="github" href="https://github.com/hopetohelp/ribit">מעבר ל־GitHub</a>
    </div>
  </section>

            <iframe id="app" hidden title="אפליקציית ריבית" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
          </div>
            <div id="keypad" aria-label="מקשי המכשיר" dir="ltr" hidden>
              <div class="qin-navigation" role="group" aria-label="ניווט">
                <button type="button" class="qin-soft" data-key="Menu" aria-label="תפריט"><span class="qin1-mark" aria-hidden="true">−</span><span class="f21-mark f21-mascot" aria-hidden="true"></span></button>
                <div class="qin-ring">
                  <button type="button" data-key="ArrowUp" aria-label="הפריט הקודם"></button>
                  <button type="button" data-key="ArrowRight" aria-label="ימינה"></button>
                  <button type="button" data-key="ArrowDown" aria-label="הפריט הבא"></button>
                  <button type="button" data-key="ArrowLeft" aria-label="שמאלה"></button>
                  <button type="button" data-key="Enter" aria-label="אישור"></button>
                </div>
                <button type="button" class="qin-soft" data-key="Backspace" aria-label="מחיקת תו"><span class="qin1-mark" aria-hidden="true">−</span><span class="f21-mark f21-return" aria-hidden="true">↶</span></button>
                <button type="button" class="qin-call" data-key="Next" aria-label="הפריט הבא"><span class="receiver" aria-hidden="true"></span></button>
                <button type="button" class="qin-call" data-key="Back" aria-label="חזרה"><span class="receiver" aria-hidden="true"></span><small aria-hidden="true">⏻</small></button>
              </div>
              <div class="digits" role="group" aria-label="מספרים">
                <button type="button" data-key="1">1<small>−</small></button>
                <button type="button" data-key="2">2<small><b aria-hidden="true">│</b>ABC</small></button>
                <button type="button" data-key="3">3<small><b aria-hidden="true">╱</b>DEF</small></button>
                <button type="button" data-key="4">4<small><b aria-hidden="true">╲</b>GHI</small></button>
                <button type="button" data-key="5">5<small><b aria-hidden="true">⌝</b>JKL</small></button>
                <button type="button" data-key="6">6<small>MNO</small></button>
                <button type="button" data-key="7">7<small>PQRS</small></button>
                <button type="button" data-key="8">8<small>TUV</small></button>
                <button type="button" data-key="9">9<small>WXYZ</small></button>
                <button type="button" data-key="-" aria-label="כוכבית, מינוס">*<small aria-hidden="true">♫</small></button>
                <button type="button" data-key="0">0<small>␣</small></button>
                <button type="button" data-key="." aria-label="סולמית, נקודה">#<small class="mic" aria-hidden="true"></small></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="/preview.js" defer></script>
</body>
</html>
